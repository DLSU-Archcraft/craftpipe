# Minecraft-style controls for Luanti (written for Luanti 5.17).
#
# Luanti keeps key bindings on each player's own computer, so a server or
# a mod cannot set them. Merge these lines into the player's minetest.conf
# while Luanti is closed:
#
#     python tools/apply_minecraft_keys.py /path/to/minetest.conf
#
# Only the keys that differ from Minecraft Java's defaults are listed.
# Movement (WASD), jump (Space), sneak (Left Shift), drop (Q), chat (T),
# command (/), hotbar (1-9) and the mouse buttons already match.
#
# Keys are written as positions on the keyboard (USB scancodes), which is
# how Luanti stores them: SYSTEM_SCANCODE_8 is the key in the E position.
# The part after "|" keeps Luanti's default gamepad button.

# Inventory: E (Luanti default: I)
keymap_inventory = SYSTEM_SCANCODE_8|GAMEPAD_BUTTON_3

# Sprint: Left Ctrl, held while moving forward (Luanti default: E).
# Luanti calls this key "Aux1"; Mineclonia uses it for sprinting.
keymap_aux1 = SYSTEM_SCANCODE_224|GAMEPAD_BUTTON_2

# Change camera view: F5 (Luanti default: C)
keymap_camera_mode = SYSTEM_SCANCODE_62

# Debug information: F3 (Luanti default: F5)
keymap_toggle_debug = SYSTEM_SCANCODE_60

# Screenshot: F2 (Luanti default: F12)
keymap_screenshot = SYSTEM_SCANCODE_59|GAMEPAD_BUTTON_14

# These two have no Minecraft equivalent and sat on keys used above.
# Show or hide the chat log: F4 (Luanti default: F2)
keymap_toggle_chat = SYSTEM_SCANCODE_61
# Fog on/off: unbound (Luanti default: F3)
keymap_toggle_fog =

# Double-tap Space to start and stop flying, as in Minecraft's creative
# mode. It only has an effect for players who are allowed to fly.
doubletap_jump = true
