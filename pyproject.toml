[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "craftpipe"
version = "0.1.0"
description = "Convert Minecraft redstone schematics to Mineclonia (Luanti) schematics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
craftpipe = "craftpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
craftpipe = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: long engine runs (deselected by default)"]
addopts = "-m 'not slow'"
